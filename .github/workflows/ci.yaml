# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI
on:
  pull_request:
  push:
    branches: [main, develop]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:

  ###################################################
  # BUILD
  ###################################################

  build:
    name: Build
    if: "!contains(github.event.head_commit.message, 'skip-ci')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        shell: bash
        run: |
          dotnet tool restore
          dotnet cake

      # The specification kit of the LapViz format: examples, schema and the Python reference reader agree
      - name: Format specification
        shell: bash
        run: |
          python3 -m pip install --quiet jsonschema
          python3 tools/python/check_examples.py
          python3 tools/python/lvz.py docs/examples/*.lvz

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .artifacts/coverage/**/coverage.cobertura.xml
          if-no-files-found: ignore

      - name: Upload Verify Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-test-results
          path: |
            **/*.received.*