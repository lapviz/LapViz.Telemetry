# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# No API key: nuget.org Trusted Publishing. The job gets a short-lived key (1 hour) in exchange for its GitHub OIDC
# token, if a policy on nuget.org (profile > Trusted Publishing) trusts owner lapviz, repository LapViz.Telemetry,
# workflow publish.yaml, environment production. Variable NUGET_USER (environment production): the nuget.org profile
# name of the policy's creator.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  actions: read
  id-token: write # GitHub OIDC token, exchanged for a nuget.org key

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:

  ###################################################
  # PUBLISH
  ###################################################

  build:
    name: Publish NuGet Packages
    if: "!contains(github.event.head_commit.message, 'skip-ci') || startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Show tag & MinVer
        run: |
          git describe --tags --always --dirty

      # Short-lived key (1 hour): build, pack and push take a few minutes
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish
        shell: bash
        run: |
          dotnet tool restore
          dotnet cake --target="publish" --configuration="Release" \
            --nuget-key="${{ steps.login.outputs.NUGET_API_KEY }}" \
            --github-key="${{secrets.GITHUB_TOKEN}}"

