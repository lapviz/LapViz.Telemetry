# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Add issues/PRs to backlog automatically

on:
  issues:
    types:
      - opened
      - transferred

# The GitHub token is not used (the project token is): no permission. Issues are opened by anybody on this public
# repository, so the action is pinned to a commit.
permissions: {}

jobs:
  add-to-project:
    name: Add issue to backlog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: https://github.com/orgs/lapviz/projects/1
          github-token: ${{ secrets.PROJECT_TOKEN }}